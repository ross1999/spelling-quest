<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Imogen's Spelling Quest</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #F4F7FB;
      --card-bg: #FFFFFF;
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --accent: #F59E0B;
      --success: #10B981;
      --danger: #EF4444;
      --text: #1E293B;
      --text-muted: #64748B;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Comic Sans MS", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      width: 100%;
      max-width: 650px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .badge-bar {
      display: flex;
      gap: 12px;
    }

    .badge {
      background: #FFF;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-icon {
      background: #FFF;
      border: none;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    .mode-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      width: 100%;
      max-width: 650px;
    }

    .mode-tab {
      flex: 1;
      padding: 12px 8px;
      border: 2px solid transparent;
      background: #E2E8F0;
      color: var(--text-muted);
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .mode-tab.active {
      background: var(--primary);
      color: #FFF;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 650px;
      border-radius: var(--radius);
      box-shadow: 0 8px 30px rgba(0,0,0,0.05);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .word-counter {
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .listen-btn {
      background: #EEF2FF;
      color: var(--primary);
      border: 2px solid var(--primary);
      border-radius: 50px;
      padding: 12px 24px;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      transition: transform 0.1s ease;
    }

    .listen-btn:active {
      transform: scale(0.96);
    }

    .slots-container {
      display: flex;
      gap: 8px;
      margin: 20px 0;
      min-height: 64px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .slot {
      width: 50px;
      height: 60px;
      border: 2px dashed #CBD5E1;
      border-radius: 12px;
      font-size: 2rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8FAFC;
    }

    .slot.filled {
      border: 2px solid var(--primary);
      background: #FFF;
      color: var(--primary);
    }

    .tile-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 480px;
      margin: 10px 0 20px 0;
    }

    .tile-btn {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #F1F5F9;
      border: 2px solid #E2E8F0;
      box-shadow: 0 4px 0 #CBD5E1;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tile-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #CBD5E1;
    }

    .tile-btn.disabled {
      opacity: 0.3;
      pointer-events: none;
      transform: translateY(3px);
      box-shadow: none;
    }

    #trace-canvas {
      border: 2px dashed #CBD5E1;
      border-radius: 16px;
      background: #FAFAFA;
      touch-action: none;
      cursor: crosshair;
    }

    .trace-actions {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }

    .action-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-clear { background: #E2E8F0; color: var(--text); }
    .btn-done { background: var(--success); color: #FFF; }
    .btn-gemini { background: #8B5CF6; color: #FFF; }

    #type-input {
      font-size: 2rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-align: center;
      padding: 10px 16px;
      width: 280px;
      border: 3px solid var(--primary);
      border-radius: 14px;
      outline: none;
      font-weight: 800;
      margin: 16px 0;
    }

    .tip-box {
      width: 100%;
      background: #FEF3C7;
      border-left: 4px solid var(--accent);
      padding: 12px 16px;
      border-radius: 10px;
      margin-top: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
      display: none;
    }

    .tip-toggle {
      color: var(--primary);
      background: none;
      border: none;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 10px;
    }

    /* Modal Styling */
    #parent-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      padding: 20px;
      overflow-y: auto;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: #FFF;
      border-radius: var(--radius);
      max-width: 650px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .config-section {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .config-section label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .config-section input, .config-section select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      font-size: 0.95rem;
      background: #FFF;
    }

    .word-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 10px;
      margin-bottom: 8px;
    }

    .word-row input {
      padding: 8px 12px;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .progress-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 0.9rem;
    }

    .progress-table th, .progress-table td {
      border: 1px solid #E2E8F0;
      padding: 8px;
      text-align: left;
    }

    .progress-table th { background: #F8FAFC; }

    .shake { animation: shake 0.3s ease-in-out; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
  </style>
</head>
<body>

  <header>
    <div class="badge-bar">
      <div class="badge">⭐ <span id="star-count">0</span></div>
      <div class="badge">🔥 <span id="streak-count">0</span></div>
    </div>
    <button class="btn-icon" onclick="openParentModal()" title="Parent Settings">⚙️</button>
  </header>

  <nav class="mode-nav">
    <div class="mode-tab active" onclick="switchMode('tiles')">🧩 Tiles</div>
    <div class="mode-tab" onclick="switchMode('trace')">✏️ Trace</div>
    <div class="mode-tab" onclick="switchMode('type')">⌨️ Type</div>
  </nav>

  <main class="card">
    <div class="word-counter" id="word-progress-label">Word 1 of 10</div>
    
    <button class="listen-btn" onclick="speakCurrentWord()">
      🔊 Hear Word
    </button>

    <div id="view-tiles" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <div class="slots-container" id="tiles-slots"></div>
      <div class="tile-grid" id="letters-pool"></div>
    </div>

    <div id="view-trace" style="display: none;" class="trace-container">
      <canvas id="trace-canvas" width="460" height="180"></canvas>
      <div class="trace-actions">
        <button class="action-btn btn-clear" onclick="initTraceCanvas()">Clear</button>
        <button class="action-btn btn-done" onclick="completeTrace()">Done Tracing!</button>
      </div>
    </div>

    <div id="view-type" style="display: none; flex-direction: column; align-items: center;">
      <input type="text" id="type-input" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="15" placeholder="TYPE HERE">
      <button class="action-btn btn-done" onclick="checkTyping()">Submit</button>
    </div>

    <button class="tip-toggle" onclick="toggleTip()">💡 Need a memory tip?</button>
    <div class="tip-box" id="tip-box"></div>
  </main>

  <!-- Parent Admin Modal -->
  <div id="parent-modal">
    <div class="modal-content">
      <h2>Weekly 10 Words Setup</h2>
      
      <!-- AI & Voice Config -->
      <div class="config-section">
        <label>Selected Voice (UK Natural voices prioritized):</label>
        <select id="voice-select" onchange="onVoiceChange()"></select>

        <label style="margin-top: 10px;">Gemini API Key (Saved locally to your browser):</label>
        <input type="password" id="gemini-key" placeholder="AIzaSy...">
        
        <div style="margin-top: 10px; display: flex; gap: 8px;">
          <button class="action-btn btn-gemini" onclick="generateAITips()">✨ Auto-Generate Tips with Gemini</button>
          <span id="gemini-status" style="font-size: 0.85rem; color: #64748B; align-self: center;"></span>
        </div>
      </div>

      <div id="word-inputs-container"></div>

      <div style="display: flex; gap: 10px; margin-top: 14px;">
        <button class="action-btn btn-done" onclick="saveParentSettings()">Save Settings & Words</button>
        <button class="action-btn btn-clear" onclick="closeParentModal()">Close</button>
      </div>

      <h3 style="margin-top: 24px;">Progress Record</h3>
      <table class="progress-table">
        <thead>
          <tr>
            <th>Word</th>
            <th>Tries</th>
            <th>1st Try %</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="progress-table-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const defaultData = {
      apiKey: "",
      preferredVoice: "",
      words: [
        { word: "BECAUSE", tip: "Big Elephants Can Always Understand Small Elephants" },
        { word: "FRIEND", tip: "A fri-END stays to the END." },
        { word: "PEOPLE", tip: "People Eat Omelettes, People Like Eggs." },
        { word: "WATER", tip: "Watch out for the 'a' that sounds like 'o'." },
        { word: "WHERE", tip: "WHERE contains 'HERE' (places)." },
        { word: "THERE", tip: "Contains 'HERE' - over there!" },
        { word: "SAID", tip: "Silly Ants In Dresses." },
        { word: "COULD", tip: "O, U, Lucky Duck!" },
        { word: "WOULD", tip: "O, U, Lucky Duck!" },
        { word: "HOUSE", tip: "Rhymes with mouse - ends with 'se'." }
      ],
      stats: {},
      stars: 0,
      streak: 1
    };

    let appState = JSON.parse(localStorage.getItem('imogen_spelling_app')) || defaultData;
    let currentIndex = 0;
    let currentMode = 'tiles';
    let currentTileInput = [];
    let firstAttempt = true;
    let availableVoices = [];

    function saveState() {
      localStorage.setItem('imogen_spelling_app', JSON.stringify(appState));
      document.getElementById('star-count').innerText = appState.stars;
      document.getElementById('streak-count').innerText = appState.streak;
    }

    /* --- SPEECH LOGIC WITH ENHANCED NATURAL VOICES --- */
    function populateVoiceList() {
      if (!('speechSynthesis' in window)) return;
      availableVoices = window.speechSynthesis.getVoices();
      const select = document.getElementById('voice-select');
      select.innerHTML = '';

      // Prioritize en-GB voices, especially Siri, Enhanced, or Neural
      const gbVoices = availableVoices.filter(v => v.lang.includes('en-GB') || v.lang.includes('en_GB'));
      const otherVoices = availableVoices.filter(v => !gbVoices.includes(v) && v.lang.startsWith('en'));

      const voiceOrder = [...gbVoices, ...otherVoices];

      voiceOrder.forEach(voice => {
        const option = document.createElement('option');
        option.value = voice.name;
        option.textContent = `${voice.name} (${voice.lang})${voice.name.includes('Enhanced') || voice.name.includes('Siri') ? ' 🌟 Natural' : ''}`;
        if (appState.preferredVoice && voice.name === appState.preferredVoice) {
          option.selected = true;
        } else if (!appState.preferredVoice && (voice.name.includes('Enhanced') || voice.name.includes('Serena') || voice.name.includes('Siri'))) {
          option.selected = true;
          appState.preferredVoice = voice.name;
        }
        select.appendChild(option);
      });
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = populateVoiceList;
      populateVoiceList();
    }

    function onVoiceChange() {
      appState.preferredVoice = document.getElementById('voice-select').value;
      saveState();
      // Test the newly selected voice
      const utterance = new SpeechSynthesisUtterance("Spelling quest ready!");
      const selected = availableVoices.find(v => v.name === appState.preferredVoice);
      if (selected) utterance.voice = selected;
      window.speechSynthesis.speak(utterance);
    }

    function currentWordObj() {
      return appState.words[currentIndex] || { word: "TEST", tip: "" };
    }

    function speakCurrentWord() {
      const text = currentWordObj().word.toLowerCase();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        
        let voice = availableVoices.find(v => v.name === appState.preferredVoice);
        if (!voice) {
          voice = availableVoices.find(v => v.lang.includes('en-GB') && (v.name.includes('Enhanced') || v.name.includes('Natural') || v.name.includes('Siri')));
        }
        if (voice) msg.voice = voice;
        msg.rate = 0.82; // Slightly paced for early learning
        window.speechSynthesis.speak(msg);
      }
    }

    /* --- GEMINI API TIP GENERATION --- */
    async function generateAITips() {
      const key = document.getElementById('gemini-key').value.trim();
      const status = document.getElementById('gemini-status');
      
      if (!key) {
        alert("Please paste your Gemini API key first.");
        return;
      }

      // Collect words from the current input inputs
      const wordsToGenerate = [];
      for (let i = 0; i < 10; i++) {
        const val = document.getElementById(`p-word-${i}`).value.trim().toUpperCase();
        if (val) wordsToGenerate.push(val);
      }

      if (wordsToGenerate.length === 0) {
        alert("Please enter at least one word first.");
        return;
      }

      status.innerText = "Generating tips...";

      const promptText = `You are a teacher helping a 6-year-old UK Key Stage 1 pupil learn spellings.
Generate a memorable spelling tip or mnemonic for each of these words: ${wordsToGenerate.join(', ')}.
Rules:
- Keep tips very short (1 sentence maximum).
- Use catchy rhymes, acrostics (e.g. "Big Elephants Can Always..."), or highlight the tricky letters (e.g. "Contains 'HERE' for places").
- Return strictly a valid JSON array of objects with keys: "word" and "tip".
Example: [{"word": "BECAUSE", "tip": "Big Elephants Can Always Understand Small Elephants"}]`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        if (!response.ok) {
          throw new Error(`API returned error: ${response.status}`);
        }

        const data = await response.json();
        const rawJson = data.candidates[0].content.parts[0].text;
        const parsedTips = JSON.parse(rawJson);

        // Update the form input fields
        parsedTips.forEach(item => {
          for (let i = 0; i < 10; i++) {
            const wordInput = document.getElementById(`p-word-${i}`);
            if (wordInput.value.trim().toUpperCase() === item.word.toUpperCase()) {
              document.getElementById(`p-tip-${i}`).value = item.tip;
            }
          }
        });

        appState.apiKey = key;
        saveState();
        status.innerText = "✨ Tips generated successfully!";
      } catch (err) {
        console.error(err);
        status.innerText = "Error generating tips. Check your API key.";
      }
    }

    /* --- GAME ENGINE & MODES --- */
    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');

      document.getElementById('view-tiles').style.display = (mode === 'tiles') ? 'flex' : 'none';
      document.getElementById('view-trace').style.display = (mode === 'trace') ? 'flex' : 'none';
      document.getElementById('view-type').style.display = (mode === 'type') ? 'flex' : 'none';

      setupCurrentWord();
    }

    function setupCurrentWord() {
      firstAttempt = true;
      const word = currentWordObj().word.toUpperCase();
      document.getElementById('word-progress-label').innerText = `Word ${currentIndex + 1} of ${appState.words.length}`;
      
      const tipBox = document.getElementById('tip-box');
      tipBox.innerText = currentWordObj().tip || "Listen carefully to each sound!";
      tipBox.style.display = 'none';

      if (currentMode === 'tiles') {
        setupTiles(word);
      } else if (currentMode === 'trace') {
        initTraceCanvas();
      } else if (currentMode === 'type') {
        const inp = document.getElementById('type-input');
        inp.value = '';
        inp.focus();
      }
    }

    function setupTiles(word) {
      currentTileInput = [];
      const slotsContainer = document.getElementById('tiles-slots');
      slotsContainer.innerHTML = '';
      for (let i = 0; i < word.length; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.id = `slot-${i}`;
        slotsContainer.appendChild(slot);
      }

      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      let letters = word.split('');
      letters.push(alphabet[Math.floor(Math.random() * 26)]);
      letters.push(alphabet[Math.floor(Math.random() * 26)]);
      letters.sort(() => Math.random() - 0.5);

      const pool = document.getElementById('letters-pool');
      pool.innerHTML = '';
      letters.forEach((char, idx) => {
        const btn = document.createElement('button');
        btn.className = 'tile-btn';
        btn.innerText = char;
        btn.onclick = () => handleTileClick(char, btn, word);
        pool.appendChild(btn);
      });
    }

    function handleTileClick(char, btn, targetWord) {
      const nextIndex = currentTileInput.length;
      if (char === targetWord[nextIndex]) {
        currentTileInput.push(char);
        const slot = document.getElementById(`slot-${nextIndex}`);
        slot.innerText = char;
        slot.classList.add('filled');
        btn.classList.add('disabled');

        if (currentTileInput.length === targetWord.length) {
          triggerSuccess();
        }
      } else {
        firstAttempt = false;
        btn.classList.add('shake');
        setTimeout(() => btn.classList.remove('shake'), 400);
      }
    }

    let canvas, ctx, isDrawing = false;
    function initTraceCanvas() {
      canvas = document.getElementById('trace-canvas');
      ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const word = currentWordObj().word.toUpperCase();
      ctx.font = 'bold 72px -apple-system, sans-serif';
      ctx.fillStyle = '#E2E8F0';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(word, canvas.width / 2, canvas.height / 2);

      ctx.lineWidth = 10;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#4F46E5';

      canvas.onpointerdown = (e) => { isDrawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };
      canvas.onpointermove = (e) => { if (isDrawing) { ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); } };
      canvas.onpointerup = () => { isDrawing = false; };
    }

    function completeTrace() {
      triggerSuccess();
    }

    function checkTyping() {
      const val = document.getElementById('type-input').value.trim().toUpperCase();
      const target = currentWordObj().word.toUpperCase();
      if (val === target) {
        triggerSuccess();
      } else {
        firstAttempt = false;
        const inp = document.getElementById('type-input');
        inp.classList.add('shake');
        setTimeout(() => inp.classList.remove('shake'), 400);
      }
    }

    function triggerSuccess() {
      confetti({ particleCount: 60, spread: 70, origin: { y: 0.6 } });
      recordAttempt(currentWordObj().word, firstAttempt);
      appState.stars += firstAttempt ? 3 : 1;
      saveState();

      setTimeout(() => {
        if (currentIndex < appState.words.length - 1) {
          currentIndex++;
          setupCurrentWord();
        } else {
          confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
          alert("🎉 Amazing job! You finished all 10 words!");
          currentIndex = 0;
          setupCurrentWord();
        }
      }, 900);
    }

    function recordAttempt(word, isFirstTry) {
      if (!appState.stats[word]) {
        appState.stats[word] = { attempts: 0, firstTryWins: 0 };
      }
      appState.stats[word].attempts++;
      if (isFirstTry) appState.stats[word].firstTryWins++;
      saveState();
    }

    function toggleTip() {
      const box = document.getElementById('tip-box');
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    /* --- PARENT MODAL --- */
    function openParentModal() {
      const code = prompt("Parent check: What is 4 + 3?");
      if (code !== "7") return;

      document.getElementById('gemini-key').value = appState.apiKey || "";
      populateVoiceList();

      const container = document.getElementById('word-inputs-container');
      container.innerHTML = '';
      for (let i = 0; i < 10; i++) {
        const item = appState.words[i] || { word: "", tip: "" };
        const row = document.createElement('div');
        row.className = 'word-row';
        row.innerHTML = `
          <input type="text" id="p-word-${i}" value="${item.word}" placeholder="Word ${i+1}">
          <input type="text" id="p-tip-${i}" value="${item.tip}" placeholder="Memory Tip / Phonics">
        `;
        container.appendChild(row);
      }

      const tbody = document.getElementById('progress-table-body');
      tbody.innerHTML = '';
      appState.words.forEach(w => {
        const wordKey = w.word.toUpperCase();
        const stat = appState.stats[wordKey] || { attempts: 0, firstTryWins: 0 };
        const pct = stat.attempts > 0 ? Math.round((stat.firstTryWins / stat.attempts) * 100) : 0;
        const status = pct >= 80 ? "⭐ Mastered" : (stat.attempts > 0 ? "Practicing" : "New");
        
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${wordKey}</strong></td>
          <td>${stat.attempts}</td>
          <td>${pct}%</td>
          <td>${status}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('parent-modal').style.display = 'flex';
    }

    function closeParentModal() {
      document.getElementById('parent-modal').style.display = 'none';
    }

    function saveParentSettings() {
      appState.apiKey = document.getElementById('gemini-key').value.trim();
      appState.preferredVoice = document.getElementById('voice-select').value;

      const newWords = [];
      for (let i = 0; i < 10; i++) {
        const w = document.getElementById(`p-word-${i}`).value.trim().toUpperCase();
        const t = document.getElementById(`p-tip-${i}`).value.trim();
        if (w) newWords.push({ word: w, tip: t });
      }
      if (newWords.length > 0) {
        appState.words = newWords;
        currentIndex = 0;
        saveState();
        setupCurrentWord();
      }
      closeParentModal();
    }

    saveState();
    setupCurrentWord();
  </script>
</body>
</html>
