/* --- REPLACE THESE TWO RULES IN YOUR <style> BLOCK --- */

#parent-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  padding: 24px 16px;
  z-index: 1000;
  align-items: center;
  justify-content: center;
  /* Prevent background bounce on mobile */
  overscroll-behavior: contain;
}

.modal-content {
  background: #FFF;
  border-radius: var(--radius);
  max-width: 650px;
  width: 100%;
  padding: 24px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
  
  /* Confines modal to the viewport and enables scrolling */
  max-height: 85vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* Optional: Clean scrollbar styling for Safari and Chrome */
.modal-content::-webkit-scrollbar {
  width: 8px;
}

.modal-content::-webkit-scrollbar-track {
  background: #F1F5F9;
  border-radius: 8px;
}

.modal-content::-webkit-scrollbar-thumb {
  background: #CBD5E1;
  border-radius: 8px;
}

.modal-content::-webkit-scrollbar-thumb:hover {
  background: #94A3B8;
}
