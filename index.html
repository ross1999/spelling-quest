<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Learning Quest</title>

  <!-- Child-friendly infant typography (single-storey 'a' and 'g' for KS1) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Celebration Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg: #F4F7FB;
      --card-bg: #FFFFFF;
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --accent: #F59E0B;
      --success: #10B981;
      --danger: #EF4444;
      --purple: #8B5CF6;
      --pink: #EC4899;
      --teal: #0D9488;
      --text: #1E293B;
      --text-muted: #64748B;
      --curtain: #BE123C;
      --curtain-shadow: #881337;
      --gold: #F59E0B;
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      width: 100%;
      max-width: 720px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .badge-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      background: #FFF;
      padding: 7px 14px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .player-badge {
      background: #EEF2FF;
      color: var(--primary);
      border: 1.5px solid #C7D2FE;
    }

    .cloud-badge {
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }
    .cloud-badge.online {
      background: #ECFDF5;
      color: #065F46;
      border: 1px solid #A7F3D0;
    }
    .cloud-badge.connecting {
      background: #FEF3C7;
      color: #92400E;
      border: 1px solid #FDE68A;
    }
    .cloud-badge.offline {
      background: #F1F5F9;
      color: #64748B;
      border: 1px solid #E2E8F0;
    }

    .nav-action-btn {
      color: #FFF;
      border: none;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .nav-action-btn:active { transform: scale(0.96); }

    .sticker-nav-btn {
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    .playground-nav-btn {
      background: linear-gradient(135deg, #EC4899, #F43F5E);
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
    }

    .btn-icon {
      background: #FFF;
      border: none;
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    /* Primary Quest Switcher (Spelling vs Times Tables) */
    .quest-switch-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 720px;
      margin-bottom: 12px;
    }

    .quest-switch-btn {
      flex: 1;
      padding: 12px;
      border-radius: 16px;
      border: 2px solid transparent;
      background: #E2E8F0;
      color: var(--text-muted);
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .quest-switch-btn.active {
      background: #FFF;
      color: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.15);
    }

    .quest-switch-btn.active.math-active {
      color: var(--teal);
      border-color: var(--teal);
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.15);
    }

    /* Sub Navigation Tabs */
    .mode-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      width: 100%;
      max-width: 720px;
    }

    .mode-tab {
      flex: 1;
      padding: 10px 4px;
      border: 2px solid transparent;
      background: #E2E8F0;
      color: var(--text-muted);
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .mode-tab.active {
      background: var(--primary);
      color: #FFF;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    .mode-tab.math-tab.active {
      background: var(--teal);
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
    }

    /* Main Card Container */
    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 720px;
      border-radius: var(--radius);
      box-shadow: 0 8px 30px rgba(0,0,0,0.05);
      padding: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .word-counter {
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    /* Audio Buttons */
    .audio-actions-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .listen-btn {
      border-radius: 50px;
      padding: 10px 20px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.1s ease;
    }
    .listen-btn:active { transform: scale(0.96); }

    .listen-btn.word-btn {
      background: #EEF2FF;
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .listen-btn.sentence-btn {
      background: #ECFDF5;
      color: #065F46;
      border: 2px solid #10B981;
    }

    .listen-btn.math-btn {
      background: #CCFBF1;
      color: #0F766E;
      border: 2px solid #0D9488;
    }

    /* Spelling Slots */
    .slots-container {
      display: flex;
      gap: 8px;
      margin: 14px 0 20px 0;
      min-height: 60px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .slot {
      width: 48px;
      height: 58px;
      border: 2px dashed #CBD5E1;
      border-radius: 14px;
      font-size: 2.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8FAFC;
      text-transform: lowercase;
    }

    .slot.filled {
      border: 2px solid var(--primary);
      background: #FFF;
      color: var(--primary);
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Tiles Grid */
    .tile-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 520px;
      margin: 6px 0 16px 0;
    }

    .tile-btn {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: #F1F5F9;
      border: 2px solid #E2E8F0;
      box-shadow: 0 3px 0 #CBD5E1;
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: lowercase;
      transition: all 0.1s ease;
    }
    .tile-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #CBD5E1;
    }
    .tile-btn.disabled {
      opacity: 0.25;
      pointer-events: none;
      transform: translateY(2px);
      box-shadow: none;
    }

    /* Trace Canvas */
    #trace-canvas {
      border: 2px dashed #CBD5E1;
      border-radius: 16px;
      background: #FAFAFA;
      touch-action: none;
      cursor: crosshair;
    }

    .trace-actions {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }

    .action-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s ease;
    }
    .action-btn:active { transform: scale(0.96); }

    .btn-clear { background: #E2E8F0; color: var(--text); }
    .btn-done { background: var(--success); color: #FFF; }
    .btn-gemini { background: var(--purple); color: #FFF; }

    /* LCWC */
    .theatre-stage {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 140px;
      border-radius: 16px;
      overflow: hidden;
      border: 3px solid #CBD5E1;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
    }

    .theatre-word {
      font-size: 3rem;
      font-weight: 600;
      letter-spacing: 4px;
      color: var(--primary);
      text-transform: lowercase;
    }

    .theatre-curtain {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, var(--curtain) 0%, var(--curtain-shadow) 100%);
      border-bottom: 8px solid var(--gold);
      transform: translateY(-100%);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #FFF;
      font-size: 1.25rem;
      font-weight: 600;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      z-index: 10;
    }

    .theatre-curtain.closed { transform: translateY(0%); }
    .theatre-curtain .fringe { position: absolute; bottom: -14px; font-size: 1.1rem; }

    .lcwc-steps-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      width: 100%;
      max-width: 440px;
    }

    .lcwc-step {
      flex: 1;
      text-align: center;
      padding: 6px;
      border-radius: 10px;
      background: #F1F5F9;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .lcwc-step.active {
      background: #EEF2FF;
      color: var(--primary);
      border: 1px solid #C7D2FE;
    }

    .comparison-display {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      min-height: 48px;
      align-items: center;
    }

    .cmp-letter {
      width: 38px;
      height: 46px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 600;
      text-transform: lowercase;
    }
    .cmp-letter.match { background: #DCFCE7; color: #15803D; border: 2px solid #86EFAC; }
    .cmp-letter.mismatch { background: #FEE2E2; color: #B91C1C; border: 2px solid #FCA5A5; }

    /* Virtual Keyboard */
    .virtual-keyboard {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      width: 100%;
      max-width: 480px;
      margin-top: 10px;
    }

    .vk-row { display: flex; gap: 5px; justify-content: center; width: 100%; }

    .vk-key {
      flex: 1;
      max-width: 42px;
      height: 48px;
      background: #F8FAFC;
      border: 1.5px solid #CBD5E1;
      border-radius: 10px;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 0 #CBD5E1;
      transition: transform 0.08s ease;
      text-transform: lowercase;
    }
    .vk-key:active { transform: translateY(2px); box-shadow: none; }
    .vk-key.special { flex: 1.5; font-size: 1.1rem; background: #E2E8F0; }

    #type-input {
      font-size: 2rem;
      letter-spacing: 4px;
      text-transform: lowercase;
      text-align: center;
      padding: 10px 16px;
      width: 280px;
      border: 2px solid var(--primary);
      border-radius: 14px;
      outline: none;
      font-weight: 600;
      margin: 14px 0;
    }

    .tip-toggle {
      color: var(--primary);
      background: #EEF2FF;
      border: 1.5px solid #C7D2FE;
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .tip-toggle:active { transform: scale(0.96); background: #E0E7FF; }

    /* ======================================================== */
    /* TIMES TABLES SPECIFIC UI STYLES                          */
    /* ======================================================== */
    .math-banner {
      background: linear-gradient(135deg, #CCFBF1, #99F6E4);
      border: 2px solid #5EEAD4;
      border-radius: 16px;
      padding: 10px 18px;
      font-size: 1.15rem;
      font-weight: 600;
      color: #115E59;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .math-equation-box {
      font-size: 3.2rem;
      font-weight: 600;
      color: #0F766E;
      margin: 10px 0 16px 0;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .math-choice-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 440px;
      margin: 10px 0;
    }

    .math-choice-btn {
      background: #F0FDFA;
      border: 3px solid #99F6E4;
      box-shadow: 0 4px 0 #5EEAD4;
      border-radius: 18px;
      padding: 18px;
      font-size: 2.2rem;
      font-weight: 600;
      color: #0F766E;
      cursor: pointer;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .math-choice-btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    .sequence-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 520px;
      margin: 14px 0;
    }

    .sequence-bubble {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, #E0F2FE, #BAE6FD);
      border: 3px solid #38BDF8;
      box-shadow: 0 4px 0 #0284C7;
      font-size: 1.7rem;
      font-weight: 600;
      color: #0369A1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .sequence-bubble:active {
      transform: scale(0.92);
    }
    .sequence-bubble.popped {
      background: #DCFCE7;
      border-color: #86EFAC;
      box-shadow: none;
      color: #15803D;
      opacity: 0.35;
      pointer-events: none;
      transform: scale(0.9);
    }

    .math-track-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 440px;
    }
    .math-track-step {
      flex: 1;
      height: 8px;
      background: #E2E8F0;
      border-radius: 999px;
      transition: background 0.2s ease;
    }
    .math-track-step.done {
      background: var(--teal);
    }

    /* Modals */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      padding: 16px;
      z-index: 9999;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-content {
      background: #FFF;
      border-radius: var(--radius);
      max-width: 680px;
      width: 100%;
      margin: 20px auto;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      max-height: 88vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .close-btn {
      background: #F1F5F9;
      border: none;
      font-size: 1.3rem;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sticker-filter-bar {
      display: flex;
      gap: 6px;
      margin: 12px 0 16px 0;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .sticker-filter-tab {
      padding: 6px 14px;
      border-radius: 999px;
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      font-size: 0.85rem;
      font-weight: 600;
      color: #64748B;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .sticker-filter-tab.active {
      background: var(--primary);
      color: #FFF;
      border-color: var(--primary);
    }

    .sticker-wallet-banner {
      background: linear-gradient(135deg, #FFFBEB, #FEF3C7);
      border: 1.5px solid #FDE68A;
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 0.95rem;
      color: #92400E;
      margin-bottom: 10px;
    }

    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }

    .sticker-card {
      background: #F8FAFC;
      border: 2px solid #E2E8F0;
      border-radius: 16px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      transition: all 0.2s ease;
    }

    @keyframes sparkleHolo {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .sticker-card.is-sparkly {
      background: linear-gradient(135deg, #FFF1F2, #F5F3FF, #E0F2FE, #FEF9C3);
      background-size: 300% 300%;
      animation: sparkleHolo 5s ease infinite;
      border: 2px solid #F59E0B;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.25);
    }

    .sparkle-tag {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 0.7rem;
      background: #FEF3C7;
      color: #B45309;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid #FDE68A;
    }

    .sticker-card.unlocked {
      background: #FFF;
      border-color: #C7D2FE;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.08);
      cursor: pointer;
    }
    .sticker-card.unlocked:hover { transform: translateY(-2px); }

    .sticker-card.affordable {
      border: 2px solid var(--success);
      background: #F0FDF4;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.18);
    }

    .sticker-card.unaffordable { opacity: 0.75; background: #F8FAFC; }

    .sticker-card .icon { font-size: 2.8rem; margin-bottom: 4px; transition: transform 0.2s ease; }
    .sticker-card:hover .icon { transform: scale(1.1); }
    .sticker-card.locked.unaffordable .icon { filter: grayscale(80%); }

    .sticker-name {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 6px;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sticker-btn {
      width: 100%;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .sticker-btn.buy-ready {
      background: linear-gradient(135deg, #10B981, #059669);
      color: #FFF;
      box-shadow: 0 3px 8px rgba(16, 185, 129, 0.35);
      animation: pulseBtn 2s infinite ease-in-out;
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .sticker-btn.need-more-box {
      background: #E2E8F0;
      color: #475569;
      cursor: not-allowed;
      flex-direction: column;
      gap: 2px;
      padding: 4px 8px;
    }

    .mini-progress-track {
      width: 100%;
      height: 5px;
      background: #CBD5E1;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 3px;
    }
    .mini-progress-fill { height: 100%; background: var(--accent); border-radius: 999px; }
    .sticker-badge { font-size: 0.75rem; color: var(--success); font-weight: 600; }

    /* Playground Canvas */
    .playground-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .scene-pill-group { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }

    .scene-pill {
      padding: 6px 12px;
      border-radius: 999px;
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }
    .scene-pill.active { background: var(--primary); color: #FFF; border-color: var(--primary); }

    .playground-stage {
      position: relative;
      width: 100%;
      height: 380px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.15);
      border: 3px solid #CBD5E1;
      touch-action: none;
      user-select: none;
    }

    .scene-woodland { background: linear-gradient(180deg, #BAE6FD 0%, #E0F2FE 55%, #86EFAC 55%, #22C55E 100%); }
    .scene-space { background: radial-gradient(ellipse at bottom, #1E1B4B 0%, #0F172A 100%); }
    .scene-castle { background: linear-gradient(180deg, #FDE68A 0%, #F472B6 45%, #A855F7 75%, #34D399 75%, #059669 100%); }
    .scene-ocean { background: linear-gradient(180deg, #38BDF8 0%, #0284C7 50%, #0369A1 100%); }

    .canvas-sticker-item {
      position: absolute;
      font-size: 3.5rem;
      cursor: grab;
      touch-action: none;
      user-select: none;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
    }
